<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>币安合约 · 量化可视化</title>
  <!-- Apache ECharts：K 线 + 指标图表的成熟开源库 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .header h1 { font-size: 18px; font-weight: 600; color: #e6edf3; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
    .toolbar select, .toolbar button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .toolbar button:hover { background: #21262d; }
    .toolbar button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    /* 指标显隐控制面板 */
    .indicator-panel {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }
    .indicator-panel .label { font-size: 12px; color: #8b949e; margin-right: 4px; }
    .indicator-panel .ind-btn {
      padding: 3px 10px;
      font-size: 12px;
      border-radius: 12px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #8b949e;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .indicator-panel .ind-btn.on {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }
    #chart {
      width: 100%;
      height: calc(100vh - 130px);
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
    }
    .status { font-size: 12px; color: #8b949e; margin-left: auto; }
    /* 数据库查看弹窗 */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-mask.open { display: flex; }
    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      width: min(760px, 92vw);
      max-height: 80vh;
      display: flex; flex-direction: column;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid #30363d;
    }
    .modal-header h2 { font-size: 15px; color: #e6edf3; font-weight: 600; }
    .modal-close { background: none; border: none; color: #8b949e; font-size: 22px; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: #e6edf3; }
    .modal-body { padding: 12px 16px; overflow: auto; }
    .db-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .db-table th, .db-table td { padding: 7px 12px; text-align: left; border-bottom: 1px solid #21262d; white-space: nowrap; }
    .db-table th { color: #8b949e; font-weight: 500; position: sticky; top: 0; background: #161b22; }
    .db-table td { color: #c9d1d9; }
    .db-empty { color: #8b949e; font-size: 13px; padding: 12px 0; }
    .strategy-modal {
      width: 100vw;
      height: 100vh;
      max-height: none;
      max-width: none;
      border-radius: 0;
    }
    .strategy-modal .modal-body {
      flex: 1;
      overflow: hidden;
    }
    .strategy-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      align-items: stretch;
      height: 100%;
      min-height: 0;
    }
    .strategy-form {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
      min-height: 0;
    }
    .strategy-form h3, .strategy-result h3 { font-size: 14px; color: #e6edf3; }
    .strategy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .strategy-field { display: flex; flex-direction: column; gap: 6px; }
    .strategy-field label { font-size: 12px; color: #8b949e; }
    .strategy-field input, .strategy-field select {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
    }
    .strategy-actions { display: flex; gap: 8px; }
    .strategy-actions button {
      background: #1f6feb;
      color: #fff;
      border: 1px solid #1f6feb;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .strategy-actions button.secondary {
      background: #161b22;
      color: #c9d1d9;
      border-color: #30363d;
    }
    .strategy-result {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px;
      min-height: 0;
      height: 100%;
      overflow: auto;
    }
    .bt-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .bt-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .bt-card .label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 6px; }
    .bt-card .value { font-size: 18px; color: #e6edf3; font-weight: 600; }
    .bt-card .value.negative { color: #ff7b72; }
    .bt-card .value.positive { color: #3fb950; }
    .bt-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .bt-pill {
      font-size: 12px;
      color: #8b949e;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 999px;
      padding: 4px 10px;
    }
    .bt-table-wrap { margin-top: 14px; overflow: auto; }
    .bt-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .bt-table th, .bt-table td { padding: 7px 8px; text-align: left; border-bottom: 1px solid #21262d; white-space: nowrap; }
    .bt-table th { color: #8b949e; font-weight: 500; }
    .bt-empty { color: #8b949e; font-size: 13px; padding: 14px 0; }
    .bt-section + .bt-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #21262d;
    }
    .bt-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .bt-section-header button {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .bt-section-header button:hover { background: #21262d; }
    .catalog-table-wrap {
      margin-top: 12px;
      overflow: auto;
      border: 1px solid #30363d;
      border-radius: 8px;
    }
    .catalog-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .catalog-table th, .catalog-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #21262d;
      vertical-align: top;
      white-space: nowrap;
    }
    .catalog-table th {
      color: #8b949e;
      font-weight: 500;
      position: sticky;
      top: 0;
      background: #161b22;
    }
    .catalog-table tbody tr:hover { background: #161b22; }
    .catalog-name { color: #e6edf3; font-weight: 600; }
    .catalog-desc { color: #8b949e; font-size: 11px; margin-top: 4px; white-space: normal; }
    .catalog-positive { color: #3fb950; }
    .catalog-negative { color: #ff7b72; }
    @media (max-width: 980px) {
      .strategy-layout { grid-template-columns: 1fr; }
      .bt-summary { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .strategy-grid { grid-template-columns: 1fr; }
      .bt-summary { grid-template-columns: 1fr; }
    }
    /* Top10 精选策略卡片 */
    .top10-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%;
      font-weight: 700; font-size: 13px;
      background: #21262d; color: #8b949e;
      flex-shrink: 0;
    }
    .top10-badge.gold { background: linear-gradient(135deg, #f0b429, #da8b00); color: #0d1117; }
    .top10-badge.silver { background: linear-gradient(135deg, #8b949e, #6e7681); color: #0d1117; }
    .top10-badge.bronze { background: linear-gradient(135deg, #bc6c25, #8a5016); color: #fff; }
    .top10-card {
      display: flex; align-items: center; gap: 14px;
      background: #0d1117; border: 1px solid #21262d; border-radius: 8px;
      padding: 14px 16px; margin-bottom: 8px;
      cursor: pointer; transition: all .15s;
    }
    .top10-card:hover { border-color: #1f6feb; background: #161b22; transform: translateX(2px); }
    .top10-info { flex: 1; min-width: 0; }
    .top10-name { color: #e6edf3; font-size: 14px; font-weight: 600; }
    .top10-desc { color: #8b949e; font-size: 11px; margin-top: 3px; font-family: monospace; }
    .top10-stats { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
    .top10-stat { text-align: right; }
    .top10-stat .val { font-size: 16px; font-weight: 700; color: #3fb950; font-family: monospace; }
    .top10-stat .lbl { font-size: 10px; color: #484f58; margin-top: 1px; }
    .top10-stat .val.neg { color: #f85149; }
    .top10-run {
      background: #238636; color: #fff; border: none; border-radius: 6px;
      padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .top10-run:hover { background: #2ea043; }
    .top10-header-info {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 12px 16px; margin-bottom: 14px; font-size: 12px; color: #8b949e;
      display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    }
    .top10-header-info b { color: #58a6ff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📈 币安合约 · K 线 & 技术指标</h1>
    <div class="toolbar">
      <select id="symbol">
        <option value="BTCUSDT">BTCUSDT</option>
        <option value="ETHUSDT">ETHUSDT</option>
        <option value="SOLUSDT">SOLUSDT</option>
        <option value="BNBUSDT">BNBUSDT</option>
        <option value="ICPUSDT">ICPUSDT</option>
      </select>
      <select id="interval">
        <option value="1m">1 分钟</option>
        <option value="5m">5 分钟</option>
        <option value="15m">15 分钟</option>
        <option value="1h">1 小时</option>
        <option value="3h">3 小时</option>
        <option value="4h">4 小时</option>
        <option value="6h">6 小时</option>
        <option value="8h">8 小时</option>
        <option value="12h">12 小时</option>
        <option value="24h">24 小时</option>
      </select>
      <select id="limit">
        <option value="100">100 根</option>
        <option value="300" selected>300 根</option>
        <option value="500">500 根</option>
        <option value="1000">1000 根</option>
      </select>
      <button id="refresh" class="active">刷新</button>
      <button id="catalogView">策略目录</button>
      <button id="top10View" style="background:#1f6feb22; border-color:#1f6feb; color:#58a6ff;">🏆 Top10</button>
      <button id="top20" style="background:#1f6feb22; border-color:#58a6ff; color:#58a6ff;">🚀 Top20</button>
      <button id="backtestView">策略回测</button>
      <button id="dbView">数据库</button>
    </div>
    <span class="status" id="status">就绪</span>
  </div>

  <!-- 指标显隐控制面板 -->
  <div class="indicator-panel" id="indicatorPanel">
    <span class="label">指标：</span>
    <!-- 按钮由 JS 动态生成，避免重复维护 -->
  </div>

  <div id="chart"></div>

  <!-- 数据库查看弹窗 -->
  <div class="modal-mask" id="dbModal">
    <div class="modal">
      <div class="modal-header">
        <h2>数据库数据概览</h2>
        <button class="modal-close" id="dbClose">&times;</button>
      </div>
      <div class="modal-body" id="dbBody">加载中...</div>
    </div>
  </div>

  <!-- 策略目录弹窗 -->
  <div class="modal-mask" id="catalogModal">
    <div class="modal" style="width: min(1100px, 95vw); max-height: 85vh;">
      <div class="modal-header">
        <h2>105 个内置策略目录</h2>
        <button class="modal-close" id="catalogClose">&times;</button>
      </div>
      <div class="modal-body" id="catalogBody">加载中...</div>
    </div>
  </div>

  <!-- Top10 精选策略弹窗 -->
  <div class="modal-mask" id="top10Modal">
    <div class="modal" style="width: min(1100px, 95vw); max-height: 85vh;">
      <div class="modal-header">
        <h2>🏆 4小时周期 Top10 精选策略</h2>
        <button class="modal-close" id="top10Close">&times;</button>
      </div>
      <div class="modal-body" id="top10Body"></div>
    </div>
  </div>

  <!-- Top20 参数扫描页面 -->
  <div class="modal-mask" id="top20Modal">
    <div class="modal" style="width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0; margin: 0;">
      <div class="modal-header">
        <h2>🚀 Top20 · 多周期策略扫描</h2>
        <div style="display:flex; align-items:center; gap:10px; margin-right:20px;">
          <select id="top20Interval" style="background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:4px; padding:4px 8px; font-size:12px;">
            <option value="1h">1小时</option>
            <option value="2h">2小时</option>
            <option value="4h" selected>4小时</option>
            <option value="6h">6小时</option>
            <option value="8h">8小时</option>
            <option value="12h">12小时</option>
            <option value="1d">日线</option>
          </select>
          <select id="top20Days" style="background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:4px; padding:4px 8px; font-size:12px;">
            <option value="60">60天</option>
            <option value="120" selected>120天</option>
            <option value="180">180天</option>
            <option value="240">240天</option>
          </select>
          <button id="top20Rescan" style="background:#238636; color:#fff; border:none; border-radius:4px; padding:5px 12px; font-size:12px; cursor:pointer;">🔄 重新扫描</button>
        </div>
        <button class="modal-close" id="top20Close">&times;</button>
      </div>
      <div class="modal-body" id="top20Body" style="max-height: calc(100vh - 60px);">
        <div class="bt-empty">点击「重新扫描」选择周期后开始扫描（正在对全部策略做参数网格遍历）...</div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="backtestModal">
    <div class="modal strategy-modal">
      <div class="modal-header">
        <h2>策略回测</h2>
        <button class="modal-close" id="backtestClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="strategy-layout">
          <form class="strategy-form" id="backtestForm">
            <h3>策略参数</h3>
            <div class="strategy-grid">
              <div class="strategy-field">
                <label for="btSymbol">合约</label>
                <select id="btSymbol">
                  <option value="BTCUSDT">BTCUSDT</option>
                  <option value="ETHUSDT">ETHUSDT</option>
                  <option value="SOLUSDT">SOLUSDT</option>
                  <option value="BNBUSDT">BNBUSDT</option>
                  <option value="ICPUSDT">ICPUSDT</option>
                </select>
              </div>
              <div class="strategy-field">
                <label for="btInterval">周期</label>
                <select id="btInterval">
                  <option value="1m">1 分钟</option>
                  <option value="5m">5 分钟</option>
                  <option value="15m">15 分钟</option>
                  <option value="1h">1 小时</option>
                  <option value="3h">3 小时</option>
                  <option value="4h">4 小时</option>
                  <option value="6h">6 小时</option>
                  <option value="8h">8 小时</option>
                  <option value="12h">12 小时</option>
                  <option value="24h">24 小时</option>
                </select>
              </div>
              <div class="strategy-field">
                <label for="btFastMa">快线 MA</label>
                <input id="btFastMa" type="number" min="1" value="7">
              </div>
              <div class="strategy-field">
                <label for="btSlowMa">慢线 MA</label>
                <input id="btSlowMa" type="number" min="2" value="25">
              </div>
              <div class="strategy-field">
                <label for="btLookback">Lookback</label>
                <input id="btLookback" type="number" min="26" value="50">
              </div>
              <div class="strategy-field">
                <label for="btLimit">样本根数(0=全部)</label>
                <input id="btLimit" type="number" min="0" value="0">
              </div>
              <div class="strategy-field">
                <label for="btCapital">初始资金(U)</label>
                <input id="btCapital" type="number" min="1" step="10" value="100">
              </div>
              <div class="strategy-field">
                <label for="btQuantity">单次保证金(U)</label>
                <input id="btQuantity" type="number" min="1" step="1" value="100">
              </div>
              <div class="strategy-field">
                <label for="btLeverage">倍数</label>
                <input id="btLeverage" type="number" min="1" step="1" value="1">
              </div>
              <div class="strategy-field">
                <label for="btFee">手续费率</label>
                <input id="btFee" type="number" min="0" step="0.0001" value="0.0004">
              </div>
            </div>
            <div class="strategy-actions">
              <button type="button" id="btRun">运行回测</button>
              <button type="button" class="secondary" id="btSync">同步当前图表</button>
            </div>
          </form>

          <div class="strategy-result">
            <div class="bt-section">
              <h3>单策略回测</h3>
              <div id="backtestBody" class="bt-empty">在左侧编辑策略参数，然后运行回测。</div>
            </div>
            <div class="bt-section">
              <div class="bt-section-header">
                <h3>100 个常见策略</h3>
                <button type="button" id="btCatalogRun">跑 100 个策略</button>
              </div>
              <div id="backtestCatalog" class="bt-empty">打开回测面板后会自动批量回测 100 个常见策略，你也可以手动重新运行。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:3000';
    const chart = echarts.init(document.getElementById('chart'), 'dark');

    // 各指标面板的 grid 配置（上下堆叠，共 6 个区域）
    // 布局从上到下：K线(含布林带) → 成交量 → RSI → MACD → KDJ → ATR/CCI/OBV
    const grids = [
      { left: 60, right: 20, top: 20, height: '38%' },       // 0: K线 + MA + BOLL
      { left: 60, right: 20, top: '44%', height: '10%' },    // 1: 成交量
      { left: 60, right: 20, top: '56%', height: '10%' },    // 2: RSI
      { left: 60, right: 20, top: '68%', height: '10%' },    // 3: MACD
      { left: 60, right: 20, top: '80%', height: '10%' },    // 4: KDJ
      { left: 60, right: 20, top: '92%', height: '8%' },     // 5: ATR/CCI/OBV
    ];

    // 指标显隐状态表：key = series 的 id，value = 是否显示
    // 这个对象是「唯一的真相源」，按钮点击改这里，再同步到图表
    const visibility = {};
    // 指标定义：{ id, label } —— 用于生成控制按钮，且 id 必须与 series 里的 id 一致
    const indicatorDefs = [
      { id: 'ma7',        label: 'MA7' },
      { id: 'ma25',       label: 'MA25' },
      { id: 'boll',       label: 'BOLL' },
      { id: 'volume',     label: '成交量' },
      { id: 'vol_ma5',    label: 'VOL_MA5' },
      { id: 'vol_ma20',   label: 'VOL_MA20' },
      { id: 'rsi',        label: 'RSI' },
      { id: 'macd',       label: 'MACD' },
      { id: 'kdj',        label: 'KDJ' },
      { id: 'atr',        label: 'ATR' },
      { id: 'cci',        label: 'CCI' },
      { id: 'obv',        label: 'OBV' },
    ];

    // 生成控制按钮
    function buildIndicatorButtons() {
      const panel = document.getElementById('indicatorPanel');
      indicatorDefs.forEach(def => {
        const btn = document.createElement('button');
        btn.className = 'ind-btn on';   // 默认全部显示
        btn.textContent = def.label;
        btn.dataset.id = def.id;
        visibility[def.id] = true;       // 初始化状态：显示
        btn.addEventListener('click', () => toggleIndicator(def.id, btn));
        panel.appendChild(btn);
      });
    }

    // 切换某个指标组的显隐
    function toggleIndicator(id, btn) {
      visibility[id] = !visibility[id];
      btn.classList.toggle('on', visibility[id]);
      applyVisibility();
    }

    // 把 visibility 状态同步到图表的所有 series
    // 注意：ECharts 的 series 没有顶层 show 属性，直接设 show 会被忽略。
    // 正确做法是用 legend.selected（按 series 的 name 匹配）来控制系列显隐。
    function applyVisibility() {
      const selected = {};
      seriesDefs.forEach(def => {
        selected[def.name] = visibility[def.group] !== false;
      });
      chart.setOption({ legend: { selected } });
    }

    // series id → 控制组 的映射（多子项指标的后缀归到主指标组）
    function groupOf(id) {
      if (!id) return null;
      if (id === 'kline') return null;   // K线不可隐藏
      const multiPart = ['boll', 'macd', 'kdj'];
      for (const g of multiPart) {
        if (id.startsWith(g + '_')) return g;
      }
      return id;                          // 单子项指标：id 即组名
    }

    // 所有 series 的 name 及其归属控制组，在 loadData 里维护
    let seriesDefs = [];

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();

      if (!res.ok) {
        const detail = text.trim() ? `: ${text.trim()}` : '';
        throw new Error(`HTTP ${res.status}${detail}`);
      }

      if (!text.trim()) {
        throw new Error(`HTTP ${res.status} 空响应`);
      }

      try {
        return JSON.parse(text);
      } catch {
        throw new Error(`HTTP ${res.status} 返回了非 JSON 响应`);
      }
    }

    function fmtNumber(value, digits = 2) {
      if (value == null || Number.isNaN(Number(value))) return '—';
      return Number(value).toFixed(digits);
    }

    async function loadData() {

        const times = data.times.map(t => {

        // 工具：把 None → null（ECharts 自动跳过空值）
        const opt = v => v.map(x => x ?? null);

        const option = {

            { gridIndex: 3, scale: true, splitLine: { show: false } },
            { gridIndex: 4, scale: true, splitLine: { show: false } },
            { gridIndex: 5, scale: true, splitLine: { show: false }, splitNumber: 2 },
          ],
          series: [
            // ========== 主图：K线 + 均线 + 布林带 ==========
            {
              id: 'kline', name: 'K线', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0,
              data: data.candles,
              itemStyle: {
                color: '#ef232a', color0: '#14b143',
                borderColor: '#ef232a', borderColor0: '#14b143',
              },
            },
            { id: 'ma7', name: 'MA7', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: opt(data.ma7), showSymbol: false, lineStyle: { width: 1, color: '#f0b90b' } },
            { id: 'ma25', name: 'MA25', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: opt(data.ma25), showSymbol: false, lineStyle: { width: 1, color: '#1f6feb' } },
            { id: 'boll_upper', name: 'BOLL上轨', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: opt(data.boll.upper), showSymbol: false, lineStyle: { width: 1, color: '#f78166', type: 'dashed' } },
            { id: 'boll_middle', name: 'BOLL中轨', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: opt(data.boll.middle), showSymbol: false, lineStyle: { width: 1, color: '#f78166' } },
            { id: 'boll_lower', name: 'BOLL下轨', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: opt(data.boll.lower), showSymbol: false, lineStyle: { width: 1, color: '#f78166', type: 'dashed' } },

            // ========== 成交量 + 量均线 ==========
            {
              id: 'volume', name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1,
              data: data.volume,
              itemStyle: { color: p => p.value >= 0 ? '#ef232a' : '#14b143' },
            },
            { id: 'vol_ma5', name: 'VOL_MA5', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: opt(data.vol_ma5), showSymbol: false, lineStyle: { width: 1, color: '#f0b90b' } },
            { id: 'vol_ma20', name: 'VOL_MA20', type: 'line', xAxisIndex: 1, yAxisIndex: 1, data: opt(data.vol_ma20), showSymbol: false, lineStyle: { width: 1, color: '#1f6feb' } },

            // ========== RSI ==========
            { id: 'rsi', name: 'RSI14', type: 'line', xAxisIndex: 2, yAxisIndex: 2, data: opt(data.rsi14), showSymbol: false, lineStyle: { width: 1, color: '#9d7bd8' } },

            // ========== MACD ==========
            { id: 'macd_dif', name: 'DIF', type: 'line', xAxisIndex: 3, yAxisIndex: 3, data: opt(data.macd.dif), showSymbol: false, lineStyle: { width: 1, color: '#f0b90b' } },
            { id: 'macd_dea', name: 'DEA', type: 'line', xAxisIndex: 3, yAxisIndex: 3, data: opt(data.macd.dea), showSymbol: false, lineStyle: { width: 1, color: '#1f6feb' } },
            { id: 'macd_hist', name: 'MACD', type: 'bar', xAxisIndex: 3, yAxisIndex: 3, data: opt(data.macd.hist), itemStyle: { color: p => p.value >= 0 ? '#ef232a' : '#14b143' } },

            // ========== KDJ ==========
            { id: 'kdj_k', name: 'K', type: 'line', xAxisIndex: 4, yAxisIndex: 4, data: opt(data.kdj.k), showSymbol: false, lineStyle: { width: 1, color: '#f0b90b' } },
            { id: 'kdj_d', name: 'D', type: 'line', xAxisIndex: 4, yAxisIndex: 4, data: opt(data.kdj.d), showSymbol: false, lineStyle: { width: 1, color: '#1f6feb' } },
            { id: 'kdj_j', name: 'J', type: 'line', xAxisIndex: 4, yAxisIndex: 4, data: opt(data.kdj.j), showSymbol: false, lineStyle: { width: 1, color: '#9d7bd8' } },

            // ========== ATR / CCI / OBV ==========
            { id: 'atr', name: 'ATR14', type: 'line', xAxisIndex: 5, yAxisIndex: 5, data: opt(data.atr14), showSymbol: false, lineStyle: { width: 1, color: '#58a6ff' } },

        // 记录所有 series 的 name → 控制组，供显隐切换使用（legend.selected 按 name 匹配）
        seriesDefs = option.series.map(s => ({ name: s.name, group: groupOf(s.id) })).filter(x => x.group);

        chart.setOption(option, true);
        // 重绘后重新应用用户的显隐选择（否则隐藏状态会被重置）
        applyVisibility();

      } catch (e) {

      }

    async function runEditorBacktest(strategy, isCompound) {
      const schema = strategy.paramSchema || [];
      const params = {};
      for (const field of schema) {
        const key = field.key;
        const el = document.getElementById('sp_' + key);
        if (!el) continue;
        const fieldType = String(field.type || '').toLowerCase();
        if (fieldType === 'bool') {
          params[key] = el.checked;
        } else if (fieldType === 'float') {
          params[key] = parseFloat(el.value) || 0;
        } else {
          params[key] = parseInt(el.value) || 0;
        }
      }

      const resultEl = document.getElementById('spResult');
      resultEl.innerHTML = '<div class="bt-empty">' + (isCompound ? '复利回测中...' : '回测中...') + '</div>';

      let endpoint, payload;
      if (isCompound) {
        endpoint = `${API_BASE}/api/backtest/compound`;
        payload = {
          kind: strategy.kind,
          symbol: document.getElementById('sp_symbol').value,
          interval: document.getElementById('sp_interval').value,
          days: parseInt(document.getElementById('sp_days').value) || 120,
          lookback: parseInt(document.getElementById('spRun').dataset.lookback) || strategy.lookback || 0,
          capital: parseFloat(document.getElementById('sp_capital').value) || 100,
          leverage: parseFloat(document.getElementById('sp_leverage').value) || 1,
          fee: parseFloat(document.getElementById('sp_fee').value) || 0.0004,
          params: params,
        };
      } else {
        endpoint = `${API_BASE}/api/backtest/custom`;
        payload = {
          strategy_id: strategy.id,
          symbol: document.getElementById('sp_symbol').value,
          interval: document.getElementById('sp_interval').value,
          capital: parseFloat(document.getElementById('sp_capital').value) || 100,
          quantity: parseFloat(document.getElementById('sp_quantity').value) || 100,
          leverage: parseFloat(document.getElementById('sp_leverage').value) || 1,
          fee: parseFloat(document.getElementById('sp_fee').value) || 0.0004,
          limit: parseInt(document.getElementById('sp_limit').value) || 0,
          lookback: strategy.lookback || 50,
          params: params,
        };
      }

      try {
        const data = await fetchJson(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        renderCustomBacktestResult(data);
      } catch (e) {
        resultEl.innerHTML = `<div class="bt-empty">回测失败：${e.message}</div>`;
      }
    }

    // 保持旧函数名作为别名，兼容其他调用
    async function runCustomBacktest(strategy) {
      return runEditorBacktest(strategy, false);
    }

    async function renderBacktestChart(symbol, interval, trades) {
      const chartDom = document.getElementById('btChart');

      try {
        // 请求足够的K线数据（1500根上限足够覆盖回测区间）

        const sellMarkers = [];

          const entryIdx = data.times.findIndex(t => t >= trade.entryTime);

            buyMarkers.push({
              coord: [entryIdx, trade.entryPrice],
              value: '买',
              itemStyle: { color: '#3fb950' },
              symbol: 'triangle',
              symbolSize: 14,

            sellMarkers.push({
              coord: [exitIdx, trade.exitPrice],
              value: '卖',
              itemStyle: { color: '#f85149' },

              symbolSize: 14,

              return `<div style="font-size:11px;">

                color: '#ef232a',

    function kindToStrategyId(kind) {
      // Map kind to a real strategy ID from the catalog

        'cciReversal': 'cci20_reversal',
        'cciMidline': 'cci20_midline',
        'priceMaCross': 'price_ma20',
        'donchianBreakout': 'donchian20',
      };
      return map[kind] || 'sma_7_25';
    }

    function kindToParamSchema(kind) {
      // Build schema matching the backend's param definitions
      switch(kind) {
        case 'maCross':
          return [
            { key: 'fast', label: '快线周期', type: 'int', min: 2, max: 200, step: 1 },
            { key: 'slow', label: '慢线周期', type: 'int', min: 3, max: 500, step: 1 },
            { key: 'useEma', label: '使用 EMA', type: 'bool' },
          ];
        case 'rsiMidline':
          return [
            { key: 'period', label: 'RSI 周期', type: 'int', min: 2, max: 100, step: 1 },
            { key: 'bullLevel', label: '多头阈值', type: 'float', min: 0, max: 60, step: 0.1 },
            { key: 'bearLevel', label: '空头阈值', type: 'float', min: 40, max: 100, step: 0.1 },
          ];
        case 'rsiReversal':
          return [
            { key: 'period', label: 'RSI 周期', type: 'int', min: 2, max: 100, step: 1 },
            { key: 'oversold', label: '超卖阈值', type: 'float', min: 0, max: 50, step: 0.1 },
            { key: 'overbought', label: '超买阈值', type: 'float', min: 50, max: 100, step: 0.1 },
          ];
        case 'rsiLongOnly':
          return [
            { key: 'period', label: 'RSI 周期', type: 'int', min: 2, max: 100, step: 1 },
            { key: 'oversold', label: '开多阈值', type: 'float', min: 0, max: 50, step: 0.1 },
            { key: 'overbought', label: '平多阈值', type: 'float', min: 50, max: 100, step: 0.1 },
          ];
        case 'macdCross':
          return [
            { key: 'fast', label: '快线 EMA', type: 'int', min: 2, max: 100, step: 1 },
            { key: 'slow', label: '慢线 EMA', type: 'int', min: 3, max: 200, step: 1 },
            { key: 'signal', label: '信号线', type: 'int', min: 2, max: 100, step: 1 },
          ];
        case 'bollReversion':
        case 'bollBreakout':
          return [
            { key: 'period', label: '布林周期', type: 'int', min: 5, max: 100, step: 1 },
            { key: 'k', label: '带宽倍数 k', type: 'float', min: 0.5, max: 5, step: 0.1 },
          ];
        case 'kdjCross':
          return [{ key: 'period', label: 'KDJ 周期', type: 'int', min: 2, max: 100, step: 1 }];
        case 'cciReversal':
          return [
            { key: 'period', label: 'CCI 周期', type: 'int', min: 2, max: 100, step: 1 },
            { key: 'threshold', label: '极值阈值', type: 'float', min: 50, max: 300, step: 1 },
          ];
        case 'cciMidline':
          return [{ key: 'period', label: 'CCI 周期', type: 'int', min: 2, max: 100, step: 1 }];
        case 'priceMaCross':
          return [
            { key: 'period', label: 'MA 周期', type: 'int', min: 2, max: 200, step: 1 },
            { key: 'useEma', label: '使用 EMA', type: 'bool' },
          ];
        case 'donchianBreakout':
          return [{ key: 'period', label: '通道周期', type: 'int', min: 3, max: 200, step: 1 }];
        default:
          return [];
      }
    }

    function kindToCategory(kind) {
      const map = {
        'maCross': '均线交叉', 'rsiReversal': 'RSI反转', 'rsiMidline': 'RSI中线',
        'rsiLongOnly': 'RSI做多', 'macdCross': 'MACD', 'bollReversion': '布林回归', 'bollBreakout': '布林突破',
        'kdjCross': 'KDJ', 'cciReversal': 'CCI反转', 'cciMidline': 'CCI中线',
        'priceMaCross': '价格/MA', 'donchianBreakout': '唐奇安突破',

    }

    // 毫秒时间戳 → 可读时间（无值显示占位）
    function fmtTime(ts) {
      if (ts == null) return '—';
      const d = new Date(ts);
      return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    async function openDbModal() {
      dbModal.classList.add('open');
      dbBody.textContent = '加载中...';
      try {
        const data = await fetchJson(`${API_BASE}/api/db`);
        const rows = data.rows || [];
        if (rows.length === 0) {
          dbBody.innerHTML = '<div class="db-empty">数据库暂无数据</div>';
          return;
        }
        let html = '<table class="db-table"><thead><tr><th>合约</th><th>周期</th><th>K线数量</th><th>最早</th><th>最新</th></tr></thead><tbody>';
        for (const r of rows) {
          html += `<tr><td>${r.symbol}</td><td>${r.interval}</td><td>${r.count}</td><td>${fmtTime(r.earliest)}</td><td>${fmtTime(r.latest)}</td></tr>`;
        }
        html += '</tbody></table>';
        dbBody.innerHTML = html;
      } catch (e) {
        dbBody.innerHTML = `<div class="db-empty">加载失败：${e.message}（请确认后端已启动）</div>`;

            <td>${fmtNumber(strategy.maxDrawdownPct)}%</td>
          </tr>
        `;
      }

      html += '</tbody></table></div>';
      backtestCatalog.innerHTML = html;
    }
  </script>
</body>
</html>

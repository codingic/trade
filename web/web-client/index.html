<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>币安合约 · 量化可视化</title>
  <!-- Apache ECharts：K 线 + 指标图表的成熟开源库 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>📈 币安合约 · K 线 & 技术指标</h1>
    <div class="toolbar">
      <select id="symbol">
        <option value="BTCUSDT">BTCUSDT</option>
        <option value="ETHUSDT">ETHUSDT</option>
        <option value="SOLUSDT">SOLUSDT</option>
        <option value="BNBUSDT">BNBUSDT</option>
        <option value="ICPUSDT">ICPUSDT</option>
      </select>
      <select id="interval">
        <option value="1m">1 分钟</option>
        <option value="5m">5 分钟</option>
        <option value="15m">15 分钟</option>
        <option value="1h">1 小时</option>
        <option value="3h">3 小时</option>
        <option value="4h">4 小时</option>
        <option value="6h">6 小时</option>
        <option value="8h">8 小时</option>
        <option value="12h">12 小时</option>
        <option value="24h">24 小时</option>
      </select>
      <select id="limit">
        <option value="100">100 根</option>
        <option value="300" selected>300 根</option>
        <option value="500">500 根</option>
        <option value="1000">1000 根</option>
      </select>
      <button id="refresh" class="active">刷新</button>
      <button id="catalogView">策略目录</button>
      <button id="top10View" style="background:#1f6feb22; border-color:#1f6feb; color:#58a6ff;">🏆 Top10</button>
      <button id="top20" style="background:#1f6feb22; border-color:#58a6ff; color:#58a6ff;">🚀 Top20</button>
      <button id="backtestView">策略回测</button>
      <button id="dbView">数据库</button>
    </div>
    <span class="status" id="status">就绪</span>
  </div>

  <!-- 指标显隐控制面板 -->
  <div class="indicator-panel" id="indicatorPanel">
    <span class="label">指标：</span>
    <!-- 按钮由 JS 动态生成，避免重复维护 -->
  </div>

  <div id="chart"></div>

  <!-- 数据库查看弹窗 -->
  <div class="modal-mask" id="dbModal">
    <div class="modal">
      <div class="modal-header">
        <h2>数据库数据概览</h2>
        <button class="modal-close" id="dbClose">&times;</button>
      </div>
      <div class="modal-body" id="dbBody">加载中...</div>
    </div>
  </div>

  <!-- 策略目录弹窗 -->
  <div class="modal-mask" id="catalogModal">
    <div class="modal" style="width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0; margin: 0;">
      <div class="modal-header">
        <h2>策略目录</h2>
        <button class="modal-close" id="catalogClose">&times;</button>
      </div>
      <div class="modal-body" id="catalogBody" style="max-height: calc(100vh - 60px);">加载中...</div>
    </div>
  </div>

  <!-- Top10 精选策略弹窗 -->
  <div class="modal-mask" id="top10Modal">
    <div class="modal" style="width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0; margin: 0;">
      <div class="modal-header">
        <h2>🏆 Top10 精选策略</h2>
        <button class="modal-close" id="top10Close">&times;</button>
      </div>
      <div class="modal-body" id="top10Body" style="max-height: calc(100vh - 60px);"></div>
    </div>
  </div>

  <!-- Top20 参数扫描页面 -->
  <div class="modal-mask" id="top20Modal">
    <div class="modal" style="width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0; margin: 0;">
      <div class="modal-header">
        <h2>🚀 Top20 · 多周期策略扫描</h2>
        <div style="display:flex; align-items:center; gap:10px; margin-right:20px;">
          <select id="top20Interval" style="background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:4px; padding:4px 8px; font-size:12px;">
            <option value="1h">1小时</option>
            <option value="2h">2小时</option>
            <option value="4h" selected>4小时</option>
            <option value="6h">6小时</option>
            <option value="8h">8小时</option>
            <option value="12h">12小时</option>
            <option value="1d">日线</option>
          </select>
          <select id="top20Days" style="background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:4px; padding:4px 8px; font-size:12px;">
            <option value="60">60天</option>
            <option value="120" selected>120天</option>
            <option value="180">180天</option>
            <option value="240">240天</option>
          </select>
          <button id="top20Rescan" style="background:#238636; color:#fff; border:none; border-radius:4px; padding:5px 12px; font-size:12px; cursor:pointer;">🔄 重新扫描</button>
        </div>
        <button class="modal-close" id="top20Close">&times;</button>
      </div>
      <div class="modal-body" id="top20Body" style="max-height: calc(100vh - 60px);">
        <div class="bt-empty">点击「重新扫描」选择周期后开始扫描（正在对全部策略做参数网格遍历）...</div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="backtestModal">
    <div class="modal strategy-modal">
      <div class="modal-header">
        <h2>策略回测</h2>
        <button class="modal-close" id="backtestClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="strategy-layout">
          <form class="strategy-form" id="backtestForm">
            <h3>策略参数</h3>
            <div class="strategy-grid">
              <div class="strategy-field">
                <label for="btSymbol">合约</label>
                <select id="btSymbol">
                  <option value="BTCUSDT">BTCUSDT</option>
                  <option value="ETHUSDT">ETHUSDT</option>
                  <option value="SOLUSDT">SOLUSDT</option>
                  <option value="BNBUSDT">BNBUSDT</option>
                  <option value="ICPUSDT">ICPUSDT</option>
                </select>
              </div>
              <div class="strategy-field">
                <label for="btInterval">周期</label>
                <select id="btInterval">
                  <option value="1m">1 分钟</option>
                  <option value="5m">5 分钟</option>
                  <option value="15m">15 分钟</option>
                  <option value="1h">1 小时</option>
                  <option value="3h">3 小时</option>
                  <option value="4h">4 小时</option>
                  <option value="6h">6 小时</option>
                  <option value="8h">8 小时</option>
                  <option value="12h">12 小时</option>
                  <option value="24h">24 小时</option>
                </select>
              </div>
              <div class="strategy-field">
                <label for="btFastMa">快线 MA</label>
                <input id="btFastMa" type="number" min="1" value="7">
              </div>
              <div class="strategy-field">
                <label for="btSlowMa">慢线 MA</label>
                <input id="btSlowMa" type="number" min="2" value="25">
              </div>
              <div class="strategy-field">
                <label for="btLookback">Lookback</label>
                <input id="btLookback" type="number" min="26" value="50">
              </div>
              <div class="strategy-field">
                <label for="btLimit">样本根数(0=全部)</label>
                <input id="btLimit" type="number" min="0" value="0">
              </div>
              <div class="strategy-field">
                <label for="btCapital">初始资金(U)</label>
                <input id="btCapital" type="number" min="1" step="10" value="100">
              </div>
              <div class="strategy-field">
                <label for="btQuantity">单次保证金(U)</label>
                <input id="btQuantity" type="number" min="1" step="1" value="100">
              </div>
              <div class="strategy-field">
                <label for="btLeverage">倍数</label>
                <input id="btLeverage" type="number" min="1" step="1" value="1">
              </div>
              <div class="strategy-field">
                <label for="btFee">手续费率</label>
                <input id="btFee" type="number" min="0" step="0.0001" value="0.0004">
              </div>
            </div>
            <div class="strategy-actions">
              <button type="button" id="btRun">运行回测</button>
              <button type="button" class="secondary" id="btSync">同步当前图表</button>
            </div>
          </form>

          <div class="strategy-result">
            <div class="bt-section">
              <h3>单策略回测</h3>
              <div id="backtestBody" class="bt-empty">在左侧编辑策略参数，然后运行回测。</div>
            </div>
            <div class="bt-section">
              <div class="bt-section-header">
                <h3>100 个常见策略</h3>
                <button type="button" id="btCatalogRun">跑 100 个策略</button>
              </div>
              <div id="backtestCatalog" class="bt-empty">打开回测面板后会自动批量回测 100 个常见策略，你也可以手动重新运行。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
